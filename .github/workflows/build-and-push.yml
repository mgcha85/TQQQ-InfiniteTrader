name: Build, Push and Deploy

on:
  push:
    branches: [master, standalone]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/tqqq-backend

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=standalone" >> $GITHUB_OUTPUT
          fi

      - name: Build and push backend (with embedded frontend)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend]
    steps:
      - name: Deploy to Oracle Cloud (master → TQQQ-InfiniteTrader)
        if: github.ref_name == 'master'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            mkdir -p ~/TQQQ-InfiniteTrader
            cd ~/TQQQ-InfiniteTrader
            if [ ! -d ".git" ]; then
              git clone -b master https://github.com/mgcha85/TQQQ-InfiniteTrader.git .
            else
              git pull origin master
            fi
            echo ${{ secrets.GHCR_TOKEN }} | podman login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            podman-compose -f docker-compose.prod.yml pull
            podman-compose -f docker-compose.prod.yml up -d
            podman image prune -f
            echo "✓ Master Deployment complete!"

      - name: Deploy to Oracle Cloud (standalone → TQQQ-Standalone)
        if: github.ref_name == 'standalone'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            mkdir -p ~/TQQQ-Standalone
            cd ~/TQQQ-Standalone
            if [ ! -d ".git" ]; then
              git clone -b standalone https://github.com/mgcha85/TQQQ-InfiniteTrader.git .
            else
              git pull origin standalone
            fi
            echo ${{ secrets.GHCR_TOKEN }} | podman login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            podman-compose -f docker-compose.prod.yml pull
            podman-compose -f docker-compose.prod.yml up -d
            podman image prune -f
            echo "✓ Standalone Deployment complete!"
