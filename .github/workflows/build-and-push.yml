name: Build, Push and Deploy

on:
  push:
    branches: [master, standalone]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/tqqq-backend

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=standalone" >> $GITHUB_OUTPUT
          fi

      - name: Build and push backend (with embedded frontend)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set deploy directory
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "dir=/home/ubuntu/TQQQ-InfiniteTrader" >> $GITHUB_OUTPUT
          else
            echo "dir=/home/ubuntu/TQQQ-Standalone" >> $GITHUB_OUTPUT
          fi

      - name: Copy deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml,start.sh,stop.sh"
          target: ${{ steps.vars.outputs.dir }}

      - name: Pull image and start service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ steps.vars.outputs.dir }}
            chmod +x start.sh stop.sh
            echo ${{ secrets.GHCR_TOKEN }} | podman login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            podman-compose -f docker-compose.prod.yml pull
            bash start.sh
            podman image prune -f
            echo "✓ Deployment complete!"
