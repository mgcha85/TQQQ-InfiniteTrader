services:
  backend:
    image: ghcr.io/mgcha85/tqqq-backend:standalone
    container_name: tqqq-backend-standalone
    ports:
      - "3001:8080"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - TZ=America/New_York
      - GIN_MODE=release
    restart: always
